apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devsecops-analyzer
  template:
    metadata:
      labels:
        app: devsecops-analyzer
    spec:
      containers:
      - name: app
        image: devsecops-analyzer:latest
        ports:
        - containerPort: 3000
        env:
        - name: MONGODB_URI
          value: "mongodb://mongo:27017/devsecops"
---
apiVersion: v1
kind: Service
metadata:
  name: devsecops-analyzer-service
spec:
  selector:
    app: devsecops-analyzer
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo
        image: mongo:5
        ports:
        - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector:
    app: mongo
  ports:
  - port: 27017
